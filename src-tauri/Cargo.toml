[package]
name = "token-tracing-widget"
version = "0.1.0"
description = "A local Windows token usage overlay"
authors = ["Token Tracing Widget"]
edition = "2021"

[lib]
name = "token_tracing_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
